<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f2a;--muted:#6b7280;--line:#e3e6ee;--bg:#f6f7fb;--card:#fff;--learn:#1b1f2a;--apk:#d98a1f;--we:#2f6fdf;--yt:#1f9e74;--exit:#d2475b;--dis:#7b4fd6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--bg);display:none;padding:64px 100px 92px;flex-direction:column}
.slide.on{display:flex}
.frag{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.frag.shown{opacity:1;transform:none}
.frag.shown.dim{opacity:.3}
.sn{position:absolute;top:22px;left:100px;font-size:18px;font-weight:600;color:#b4bac5}
.pill{align-self:flex-start;font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:7px 16px;border-radius:999px;background:var(--learn)}
.apk .pill{background:var(--apk)}.we .pill{background:var(--we)}.yt .pill{background:var(--yt)}.ex .pill{background:var(--exit)}
.slide h2{font-size:50px;font-weight:800;letter-spacing:-.02em;margin:16px 0 22px;line-height:1.08}
.wename{font-size:34px;font-weight:800;letter-spacing:-.01em;margin:12px 0 0}
.slide p,.slide li{font-size:28px;line-height:1.45}
.muted{color:var(--muted)}
.src{position:absolute;left:100px;bottom:30px;font-size:17px;color:#9aa1ad}
.foot{position:absolute;left:100px;right:100px;bottom:30px;display:flex;justify-content:space-between;font-size:17px;color:#9aa1ad}
em.v{font-style:italic}
.row{display:flex;gap:40px;align-items:flex-start}.row>*{flex:1}
/* question */
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 32px;font-size:27px;line-height:1.42}
.q ol.sub{list-style:none;margin-top:8px}.q ol.sub li{font-size:inherit;padding:2px 0}
.q ol.sub li b{display:inline-block;width:38px;color:var(--muted)}
.bul{margin:6px 0 6px 34px}.bul li{font-size:inherit}
[data-part]{transition:opacity .3s}.dim{opacity:.25}
/* solution bar (always visible) */
.sol{margin-top:16px;border-left:6px solid var(--we);padding:6px 0 6px 24px;min-height:64px}
.sol p{font-size:24px;margin:3px 0;line-height:1.38}
.reveal{color:var(--we);font-weight:700}
/* tables */
table.t{border-collapse:collapse;font-size:26px;background:#fff}
table.t th,table.t td{border:1.5px solid #9aa1ad;padding:6px 16px;text-align:center}
table.t th{background:#eef1f7;font-weight:700}table.t td.l,table.t th.l{text-align:left}
table.t tr.tot td{font-weight:700}
.cell{visibility:hidden}.cell.on{visibility:visible;animation:pop .45s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
/* step cards with arrows */
.stepsH{display:flex;gap:30px;margin-top:auto;margin-bottom:4px}
.sc{flex:1;min-height:118px;border:2px dashed #c7d2e6;border-radius:14px;padding:16px 14px 10px;position:relative;transition:all .3s}
.sc:has(.shown){border-style:solid;border-color:var(--we);background:#fff}
.sc:not(:last-child)::after{content:'';position:absolute;right:-24px;top:50%;transform:translateY(-50%);border-left:15px solid #9aa1ad;border-top:9px solid transparent;border-bottom:9px solid transparent}
.sc .n{position:absolute;top:-15px;left:12px;background:var(--we);color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sc .st{font-size:20px;font-weight:800;color:var(--we);margin-bottom:4px}
.sc .sb{font-size:19px;line-height:1.35}
.sc .sb .katex{white-space:nowrap}.tiny{font-size:14px;color:var(--muted);display:inline-block;margin-top:4px;line-height:1.3}
.tip{margin-top:14px;background:#fff7e6;border:2px solid #e3a33b;border-radius:12px;padding:10px 16px;font-size:21px}.tip b{color:#9a5a00}
.hw table{border-collapse:collapse;width:100%}.hw td{font-size:22px;padding:7px 0;border-bottom:1px solid var(--line)}.hw td:last-child{text-align:right;font-weight:800;white-space:nowrap;padding-left:16px;color:var(--we)}
/* MC */
.stem{margin-bottom:6px}
.mc{display:grid;gap:3px;margin-top:8px}.mc.cols{grid-template-columns:repeat(3,1fr);column-gap:14px}
.mcslide h2{font-size:40px;margin:12px 0 14px}.mcslide .q{font-size:23px;padding:16px 26px}
.mc div{font-size:inherit;position:relative;padding:1px 8px;border-radius:8px}
.mc b{display:inline-block;width:40px}
.mc div.right{background:#d9f4e7;outline:2px solid var(--yt);font-weight:700}
.mc div.dis{background:#efe6fd;outline:2px solid var(--dis);color:#4b2a9a}
.mc .pb{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:rgba(120,130,150,.13);transition:width .8s ease;z-index:0}
.mc div>b{position:relative;z-index:1}
.mc .pc{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700;color:#6b7280;opacity:0;transition:opacity .4s;z-index:1}
.slide.pct .mc .pc{opacity:1}
.mc div.right .pb{background:rgba(31,158,116,.22)}.mc div.dis .pb{background:rgba(123,79,214,.2)}
.mcsol{display:flex;gap:20px;margin-top:14px}
.ansbox{background:#effaf5;border:2px solid var(--yt);border-radius:16px;padding:12px 22px;flex:1}
.ansbox .lab,.dbox .lab,.dbox .lab2{font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--yt);margin-bottom:4px}
.ansbox p,.dbox p{font-size:21px;line-height:1.4;margin:0}
.dbox{flex:1;background:#f4effd;border:2px solid var(--dis);border-radius:16px;padding:12px 22px;min-height:96px}
.dbox .lab,.dbox .lab2{color:#6a3fc7}.dbox .lab2{margin-top:2px}
.dbox.none{background:#f3f4f6;border-color:#9aa1ad}.dbox.none .lab{color:#6b7280}
.stat{position:absolute;right:100px;top:58px;font-size:20px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 18px}
.stat b{font-size:24px;color:var(--ink)}.stat.done b{color:var(--yt)}
/* title */
.s-title{background:#fff;justify-content:center}
.s-title .kicker{display:flex;gap:14px;align-items:center;font-size:22px;font-weight:600;color:var(--we)}
.s-title .kicker i{width:10px;height:10px;border-radius:50%;background:var(--we);flex:none}
.s-title h1{font-size:96px;line-height:1.02;font-weight:800;letter-spacing:-.025em;margin:26px 0 22px}.s-title h1 span{color:var(--we)}
.s-title .sub{font-size:30px;color:var(--muted);font-weight:500}
.hook{margin-top:56px;display:flex;gap:28px;max-width:1180px}.hook .bar{width:8px;border-radius:4px;background:var(--we);flex:none}
.hook p{font-size:34px;line-height:1.35;font-weight:500}.hook em{font-style:normal;color:var(--we);font-weight:700}
.flow{position:absolute;left:100px;right:100px;bottom:96px;display:flex;gap:10px}
.flow div{flex:1;border-top:6px solid;padding-top:12px;font-size:19px;font-weight:600;color:var(--muted)}
/* LI/SC */
.lisc{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.lisc h3{font-size:22px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
.lisc ul{list-style:none}.lisc li{font-size:25px;padding:7px 0 7px 36px;position:relative;border-bottom:1px solid var(--line)}
.lisc li:before{content:'';position:absolute;left:4px;top:18px;width:14px;height:14px;border-radius:4px;border:2.5px solid var(--we)}
.seq{list-style:none}.seq li{font-size:25px;padding:10px 0 10px 60px;position:relative;border-bottom:1px solid var(--line)}
.seq{counter-reset:n}.seq li{counter-increment:n}
.seq li:before{content:counter(n);position:absolute;left:0;top:9px;width:38px;height:38px;border-radius:50%;color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;background:var(--c,#1b1f2a)}
.seq li small{color:var(--muted);font-size:20px}
/* tree */
.tree{position:relative;height:560px}
.node{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:12px 22px;text-align:center;font-size:27px;font-weight:700;min-width:250px}
.node.frag{transform:translate(-50%,-42%)}.node.frag.shown{transform:translate(-50%,-50%)}
.node small{display:block;font-size:19px;font-weight:500;color:var(--muted);margin-top:4px}
.node.cat{border-color:#c0632b;color:#c0632b}.node.num{border-color:var(--we);color:var(--we)}
.node .ic{width:62px;height:42px;display:block;margin:0 auto 6px}
.tree>svg{position:absolute;inset:0;width:100%;height:100%}
.tree>svg line{stroke:#9aa1ad;stroke-width:3;transition:opacity .35s}
.q-tag{display:inline-block;background:#fff3df;color:#9a5a00;border-radius:8px;padding:2px 10px;font-size:19px;font-weight:700;margin-top:6px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:8px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:22px 24px;cursor:pointer;min-height:150px;transition:border-color .2s}
.card .nm{font-size:28px;font-weight:700}.card .eg{font-size:21px;color:var(--muted);margin-top:4px}
.card .ans{margin-top:12px;font-size:24px;font-weight:700;opacity:0;transition:opacity .25s}
.card.open .ans{opacity:1}.card.open{border-color:var(--we)}.card .ans.c{color:#c0632b}.card .ans.n{color:var(--we)}
/* key box */
.key{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:22px 30px}
.key h4{font-size:20px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.key p{font-size:28px}
/* charts */
.chart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.chart svg text{font-family:Inter,sans-serif}
.chart .lg{transition:opacity .4s}.chart.hidelg .lg{opacity:0}
/* chips */
.chips{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.chip{font-size:13.5px;font-weight:600;text-align:center;padding:5px 0;overflow:hidden;border-radius:7px;background:#fff;border:1.5px solid var(--line);color:#555;transition:all .15s}
.chip.hc{background:#ffe6d2;border-color:#c0632b;color:#8a3d10}.chip.ho{background:#dbe6fb;border-color:var(--we);color:#1f4fb0}
/* report template */
.report{background:#fff;border-radius:16px;border:1px solid var(--line);padding:18px 26px}
.report p,.tpl{font-size:24px;line-height:1.75}
.hl1{background:#fff3c4}.hl2{background:#dbeafe}.hl3{background:#dcfce7}
.blank{display:inline-block;border-bottom:2px dashed #8a919c;padding:0 6px;margin:0 2px;line-height:1.2}
.blank .ph{color:#8a919c;font-style:italic;font-size:.85em}.blank .fill{display:none;font-weight:700}
.blank.filled{border-bottom-style:solid;border-color:transparent}
.blank.filled .ph{display:none}.blank.filled .fill{display:inline;animation:pop .45s}
.report.swap .final{display:none}.report.swap.done .final{display:block;animation:pop .5s}.report.swap.done .tplwrap{display:none}
/* video + CFU */
.vid{position:absolute;right:100px;top:58px;font:600 19px Inter,sans-serif;color:var(--we);background:#fff;border:2px solid var(--we);border-radius:999px;padding:7px 18px;cursor:pointer}
.vid.empty{border-style:dashed;color:#8a9ab8;border-color:#a9bde6}
#vmodal{position:fixed;inset:0;background:rgba(10,12,20,.82);display:none;align-items:center;justify-content:center;z-index:9}
#vmodal.on{display:flex}#vmodal .box{width:80vw;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
#vmodal iframe,#vmodal video{width:100%;height:100%;border:0}
#vmodal .ph{color:#cfd6e4;font:500 22px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;text-align:center}
.cfu{position:absolute;right:100px;bottom:16px;display:flex;gap:14px}
.cfu div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#8a919c;width:78px;text-align:center;line-height:1.1}
.cfu img{width:42px;height:42px;opacity:.85}
#prog{position:fixed;left:0;bottom:0;height:4px;background:#2f6fdf;transition:width .3s}

.dn .pill{background:#00838F}
.dot svg circle.dt{opacity:0;transition:opacity .2s}.dot svg circle.dt.on{opacity:1}
.stemplot{font-family:ui-monospace,Menlo,monospace;font-size:26px;border-collapse:collapse;background:#fff}
.stemplot td{padding:2px 8px;line-height:1.35}.stemplot td.st{text-align:right;border-right:3px solid var(--ink);padding-right:12px;font-weight:700}
.stemplot td.lv{letter-spacing:.35em;padding-left:12px;min-width:200px}
.stemplot .lf{opacity:0;transition:opacity .2s}.stemplot .lf.on{opacity:1}
.stemcap{font-size:20px;margin-bottom:6px}.stemcap b{font-style:italic}
.data{font-family:ui-monospace,Menlo,monospace;font-size:24px;word-spacing:.35em;line-height:1.55;margin:8px 0}
.cas{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cas .key{padding:16px 22px}.cas ol{margin-left:28px}.cas li{font-size:21px;line-height:1.4;padding:2px 0}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.mini .key{padding:12px 14px;text-align:center}.mini .key h4{margin-bottom:2px}.mini p{font-size:20px!important;line-height:1.3}
.logline{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 10px}
.sol p.big{font-size:27px}
.ansbox.e2 p{font-size:22px}

/* ---------- S3: centre and spread ---------- */
.seqrow{display:flex;gap:9px;flex-wrap:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:25px;margin:6px 0}
.seqrow span{min-width:46px;text-align:center;padding:3px 6px;border-radius:9px;background:#fff;border:1.5px solid var(--line);transition:all .3s}
.seqrow span.cnt,.lf2.cnt{opacity:.28}
.seqrow span.gap{border:0;background:none;min-width:14px;padding:0}
.mid{background:#ffd9de!important;border-color:#d2475b!important;color:#b0263a!important;font-weight:800}
.q1m{background:#ece3fd!important;border-color:var(--dis)!important;color:#5b33b0!important;font-weight:800}
.ext{background:#fff1c9!important;border-color:#d98a1f!important;color:#8a4d00!important;font-weight:800}
.stem3{font-family:ui-monospace,Menlo,monospace;font-size:26px;border-collapse:collapse;background:#fff}
.stem3 td{padding:2px 8px;line-height:1.38}
.stem3 td.st{text-align:right;border-right:3px solid var(--ink);padding-right:12px;font-weight:700}
.stem3 td.lv{padding-left:10px;min-width:200px;white-space:nowrap}
.lf2{display:inline-block;min-width:.95em;text-align:center;margin-right:.32em;border-radius:6px;border:1.5px solid transparent;transition:all .3s}
.lf2.mid,.lf2.q1m,.lf2.ext{padding:0 2px}
.xp{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.chip3{position:absolute;width:74px;height:58px;border-radius:12px;border:2.5px solid var(--we);background:#fff;font:700 27px Inter,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:left .75s cubic-bezier(.5,0,.2,1),top .5s,opacity .35s,background .3s,border-color .3s}
.chip3.cnt{opacity:.25}
.chip3.new{border-color:#d98a1f}
.xlab{position:absolute;font:600 24px Inter,sans-serif;color:var(--ink);transition:opacity .35s,left .6s;white-space:nowrap}
.xlab.c{transform:translateX(-50%)}
.xlab .red{color:#d2475b}.xlab .pur{color:#6a3fc7}
.band{position:absolute;background:rgba(47,111,223,.12);border:2px dashed var(--we);border-radius:14px;transition:opacity .4s}

.mk{position:absolute;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:15px solid #d2475b;transform:translateX(-50%);transition:opacity .35s}

.hide{opacity:0!important}
.rowtag{position:absolute;left:20px;font:700 20px Inter,sans-serif;color:var(--muted)}
#balx svg g.mv{transition:transform .9s cubic-bezier(.5,0,.2,1)}

.formula{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 26px;font-size:28px}
.timer{font:800 120px Inter,sans-serif;letter-spacing:-.02em;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}

.chart svg text.cum{font-weight:800;fill:#1f4fb0;transition:opacity .3s}
.cfat .pill{background:#00838F}

/* ---------- S4: boxplots ---------- */
.bxp{transition:opacity .45s}
.bxo{transition:fill .3s}
.mini4{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.tbl1{display:flex;gap:18px}
.tbl1 table td,.tbl1 table th{padding:1px 12px}
.hj87{transition:all .3s}
</style>

const PAL=['#9db8f0','#4f84e6','#1f4fb0'];
function el(t,a,x){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;return e}
const col=(c,j)=>PAL[c.names.length===2?(j===0?0:2):j];
function drawBar(box,c){const W=560,H=c.h||380,L=78,B=70,T=18,R=18,ph=H-T-B,pw=W-L-R,s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});
  for(let y=0;y<=c.max;y+=c.step){const yy=T+ph-y/c.max*ph;s.append(el('line',{x1:L,x2:W-R,y1:yy,y2:yy,stroke:'#e3e6ee'}),el('text',{x:L-12,y:yy+7,'text-anchor':'end','font-size':20,fill:'#555'},y))}
  const bw=pw/c.cats.length;c.cats.forEach((k,i)=>{const h=c.v[i]/c.max*ph;s.append(el('rect',{x:L+i*bw+bw*.2,width:bw*.6,y:T+ph-h,height:h,fill:'#4f84e6',class:'grow','data-y':T+ph-h,'data-h':h,'data-d':i*150}),el('text',{x:L+i*bw+bw/2,y:T+ph+30,'text-anchor':'middle','font-size':21},k))});
  s.append(el('line',{x1:L,x2:W-R,y1:T+ph,y2:T+ph,stroke:'#333','stroke-width':2}),el('line',{x1:L,x2:L,y1:T,y2:T+ph,stroke:'#333','stroke-width':2}),
    el('text',{x:L+pw/2,y:H-10,'text-anchor':'middle','font-size':21,'font-weight':600},c.xl),el('text',{x:22,y:T+ph/2,'text-anchor':'middle','font-size':21,'font-weight':600,transform:`rotate(-90 22 ${T+ph/2})`},c.yl));box.append(s)}
function drawSeg(box,c){const nb=c.bars.length,H=c.h||420,L=78,B=c.xl?(nb>1?95:60):40,T=18,pw=nb>1?400:200,ph=H-T-B,LW=230,W=L+pw+LW,s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'}),tk=c.ticks||20;
  for(let y=0;y<=100;y+=tk){const yy=T+ph-y/100*ph;s.append(el('line',{x1:L,x2:L+pw,y1:yy,y2:yy,stroke:'#e3e6ee'}),el('text',{x:L-12,y:yy+7,'text-anchor':'end','font-size':20,fill:'#555'},c.scale?Math.round(y/100*c.scale):y))}
  const bw=pw/nb;c.bars.forEach((b,i)=>{let acc=0;b.v.forEach((v,j)=>{const h=v/100*ph,y=T+ph-(acc+v)/100*ph;
      s.append(el('rect',{x:L+i*bw+bw*.15,width:bw*.7,y,height:h,fill:col(c,j),stroke:'#fff','stroke-width':1.5,class:'grow','data-y':y,'data-h':h,'data-d':j*250}));acc+=v});
    if(b.label)s.append(el('text',{x:L+i*bw+bw/2,y:T+ph+30,'text-anchor':'middle','font-size':19},b.label))});
  s.append(el('line',{x1:L,x2:L+pw,y1:T+ph,y2:T+ph,stroke:'#333','stroke-width':2}),el('line',{x1:L,x2:L,y1:T,y2:T+ph,stroke:'#333','stroke-width':2}),el('text',{x:22,y:T+ph/2,'text-anchor':'middle','font-size':20,'font-weight':600,transform:`rotate(-90 22 ${T+ph/2})`},c.yl));
  if(c.xl)s.append(el('text',{x:L+pw/2,y:H-14,'text-anchor':'middle','font-size':20,'font-weight':600,'font-style':'italic'},c.xl));
  const g=el('g',{class:'lg'});(c.legendTop||c.names).forEach((n,k)=>{const j=c.names.indexOf(n);g.append(el('rect',{x:L+pw+24,y:T+8+k*36,width:24,height:24,fill:col(c,j)}),el('text',{x:L+pw+58,y:T+28+k*36,'font-size':19,'font-weight':600},n))});s.append(g);box.append(s)}
document.querySelectorAll('[data-chart="bar"],[data-chart="seg"]').forEach(b=>{const c=JSON.parse(b.dataset.cfg);(b.dataset.chart==='bar'?drawBar:drawSeg)(b,c)});

function fmtx(x,d){return d!=null?x.toFixed(d).replace('-','−'):String(+x.toFixed(6)).replace('-','−')}
function drawHist(box,c){const W=c.W||640,H=c.h||400,L=c.L||74,B=c.xl?76:44,T=16,R=24,ph=H-T-B,pw=W-L-R,fs=c.fs||19;
  const x0=c.xmin!=null?c.xmin:c.start,x1=c.xmax!=null?c.xmax:c.start+c.w*c.v.length,sx=x=>L+(x-x0)/(x1-x0)*pw;
  const s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});
  for(let y=0;y<=c.ymax+1e-9;y+=c.ystep){const yy=T+ph-y/c.ymax*ph;s.append(el('line',{x1:L,x2:W-R,y1:yy,y2:yy,stroke:'#e3e6ee'}));if(!c.noy)s.append(el('text',{x:L-10,y:yy+7,'text-anchor':'end','font-size':fs,fill:'#555'},(c.pct?y+'%':y)))}
  c.v.forEach((v,i)=>{if(v<=0)return;const h=v/c.ymax*ph,a=sx(c.start+i*c.w),b=sx(c.start+(i+1)*c.w);

/* --- histogram running totals --- */

  [...svg.querySelectorAll('rect.grow')].forEach((r,k)=>{const v=+r.dataset.v;tot+=v;const t=tot;later(()=>{svg.append(el('text',{class:'cum',x:+r.getAttribute('x')+ +r.getAttribute('width')/2,y:+r.dataset.y-8,'text-anchor':'middle','font-size':18},t))},k*260)})}
function hlBar(spec){const [sel,i,col]=spec.split('|');const r=document.querySelector(sel+' rect.grow[data-i="'+i+'"]');if(r){r.setAttribute('fill',col);r.setAttribute('stroke',col)}}
/* --- dot plot with markable dots --- */
function drawDot3(box,c){const W=c.W||900,H=c.h||240,L=34,R=34,B=72,r=c.r||12,fs=c.fs||20,n=c.max-c.min,pw=W-L-R,sx=x=>L+(x-c.min)/n*pw,base=H-B;
  const s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});s.append(el('line',{x1:L-14,x2:W-R+14,y1:base,y2:base,stroke:'#333','stroke-width':2}));
  for(let x=c.min;x<=c.max;x+=(c.step||1)){const xx=sx(x);s.append(el('line',{x1:xx,x2:xx,y1:base,y2:base+8,stroke:'#333','stroke-width':1.5}),el('text',{x:xx,y:base+32,'text-anchor':'middle','font-size':fs},x))}
  if(c.xl)s.append(el('text',{x:L+pw/2,y:H-8,'text-anchor':'middle','font-size':fs+1,'font-weight':600,'font-style':'italic'},c.xl));
  const cnt={};let i=0;c.vals.slice().sort((a,b)=>a-b).forEach(v=>{cnt[v]=(cnt[v]||0)+1;s.append(el('circle',{cx:sx(v),cy:base-r-5-(cnt[v]-1)*(2*r+3),r,fill:'#1f4fb0','data-i':i++,class:'d3'}))});box.append(s)}
function markDots(spec){const [sel,ks,col]=spec.split('|');ks.split(',').forEach(k=>{const d=document.querySelector(sel+' circle[data-i="'+k+'"]');if(d){d.setAttribute('fill',col||'#d2475b');d.setAttribute('r',+d.getAttribute('r')+2)}})}
/* --- CFAT timer --- */
let TIM=null;function timerReset(){clearInterval(TIM);TIM=null;const t=document.getElementById('cfatT');if(t){t.textContent='20:00';t.classList.remove('go')}}
function timerGo(){const t=document.getElementById('cfatT');if(!t)return;clearInterval(TIM);let s=1200;t.classList.add('go');TIM=setInterval(()=>{s--;t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s<=0)clearInterval(TIM)},1000)}
function s3apply(s,f){const a=f.dataset.act;
  if(a==='m-order')medSet({ordered:1});if(a==='m-count')medCount();
  if(a==='m-even'){medSet({extra:1,ordered:0,dim:0,mid:0});later(()=>medSet({ordered:1}),500)}
  if(a==='m-evenmid')medCount();
  if(a&&a.startsWith('q-')){const [_,ri,k]=a.split('-');qSet([+ri,k])}
  if(a==='b-8')balSet(8);
  if(a&&a.startsWith('sd-'))sdSet({[a.slice(3)]:1});
  if(a==='timer')timerGo();
  if(f.dataset.count)f.dataset.count.split(' ').forEach(countIn);
  if(f.dataset.mark)f.dataset.mark.split(' ').forEach(markIdx);
  if(f.dataset.cum)cumBars(f.dataset.cum);
  if(f.dataset.hlbar)f.dataset.hlbar.split(' ').forEach(hlBar);
  if(f.dataset.showbar){const [sel,ks]=f.dataset.showbar.split('|');ks.split(',').forEach(k=>{const r=document.querySelector(sel+' rect.grow[data-i="'+k+'"]');if(r){r.style.opacity=1;r.setAttribute('fill','#d98a1f');r.setAttribute('stroke','#9a5a00');grow(r)}})}
  if(f.dataset.dotmark)markDots(f.dataset.dotmark)}
function s3reset(s){S3T.splice(0).forEach(clearTimeout);
  s.querySelectorAll('[data-i]').forEach(e=>e.classList.remove('cnt','mid','q1m','ext'));
  s.querySelectorAll('text.cum').forEach(t=>t.remove());
  s.querySelectorAll('rect.grow[data-c0]').forEach(r=>{r.setAttribute('fill',r.dataset.c0);r.setAttribute('stroke','#1f4fb0')});
  s.querySelectorAll('[data-miss]').forEach(b=>b.dataset.miss.split(',').forEach(k=>{const r=b.querySelector('rect.grow[data-i="'+k+'"]');if(r)r.style.opacity=0}));
  s.querySelectorAll('circle.d3').forEach(d=>{d.setAttribute('fill','#1f4fb0');d.setAttribute('r',d.dataset.r0||d.getAttribute('r'))});
  if(s.querySelector('#medx'))medSet({extra:0,ordered:0,dim:0,mid:0});
  if(s.querySelector('#qx'))qSet(null);
  if(s.querySelector('#balx'))balSet(4);
  if(s.querySelector('#sdx'))sdSet({a:0,ad:0,b:0,bd:0,s:0});
  if(s.querySelector('#cfatT'))timerReset()}
function s3init(){document.querySelectorAll('[data-chart="dot3"]').forEach(b=>drawDot3(b,JSON.parse(b.dataset.cfg)));
  document.querySelectorAll('circle.d3').forEach(d=>d.dataset.r0=d.getAttribute('r'));
  document.querySelectorAll('[data-chart="hist"] rect.grow').forEach(r=>{r.dataset.c0=r.getAttribute('fill')});
  document.querySelectorAll('[data-chart="hist"]').forEach(b=>{const c=JSON.parse(b.dataset.cfg);b.querySelectorAll('rect.grow').forEach(r=>r.dataset.v=c.v[+r.dataset.i])});
  document.querySelectorAll('[data-lab]').forEach(b=>{const svg=b.querySelector('svg');JSON.parse(b.dataset.lab).forEach(([i,t])=>{const r=svg.querySelector('rect.grow[data-i="'+i+'"]');svg.append(el('text',{x:+r.getAttribute('x')+ +r.getAttribute('width')/2,y:+r.dataset.y-8,'text-anchor':'middle','font-size':20,'font-weight':700},t))})});
  /* explainers need real widths: build once the slide is first shown */
  medBuild();qBuild();balBuild();sdBuild()}

s3init();s4init();
/* ---------- S4: boxplots (stepped build, marks, fences, % bands) ---------- */
function drawBox(box,c){const W=c.W||1000,L=c.L||34,R=c.R||34,fs=c.fs||20,bh=c.bh||56,T=c.top!=null?c.top:64,dec=c.dec||0;
  const cy=T+bh/2+10,ay=cy+bh/2+30,H=ay+(c.xl?66:42),sx=x=>L+(x-c.min)/(c.max-c.min)*(W-L-R);box._sx=sx;
  const s=el('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%'});const hide=new Set(c.hide||[]);
  const g=p=>{const e=el('g',{class:'bxp','data-p':p});if(hide.has(p))e.style.opacity=0;s.append(e);return e};
  /* axis */
  const ax=g('axis');
  ax.append(el('line',{x1:L-14,x2:W-R+14,y1:ay,y2:ay,stroke:'#333','stroke-width':2}));
  const st=c.step||1,lb=c.lab||st,n=Math.round((c.max-c.min)/st);
  for(let k=0;k<=n;k++){const x=c.min+k*st,xx=sx(x),big=Math.abs(((x-c.min)/lb)-Math.round((x-c.min)/lb))<1e-6;
    ax.append(el('line',{x1:xx,x2:xx,y1:ay,y2:ay+(big?10:6),stroke:'#333','stroke-width':big?2:1.2}));
    if(big&&!c.nolab)ax.append(el('text',{x:xx,y:ay+34,'text-anchor':'middle','font-size':fs},(c.fmt==='k'?x.toLocaleString('en-AU').replace(/,/g,' '):x.toFixed(dec))))}
  if(c.xl)ax.append(el('text',{x:(L+W-R)/2,y:H-10,'text-anchor':'middle','font-size':fs+1,'font-weight':600,'font-style':'italic'},c.xl));
  /* bands (behind the plot) */
  (c.bands||[]).forEach(b=>{const e=g(b.p);if(!b.show){e.style.opacity=0;e.dataset.h=1}e.dataset.band=1;
    e.append(el('rect',{x:sx(b.a),width:sx(b.b)-sx(b.a),y:cy-bh/2-8,height:bh+16,rx:6,fill:b.col||'rgba(217,138,31,.22)',stroke:b.sc||'#d98a1f','stroke-width':2,'stroke-dasharray':'6 4'}),
      el('text',{x:(sx(b.a)+sx(b.b))/2,y:cy-bh/2-16-(b.lv||0)*26,'text-anchor':'middle','font-size':fs,'font-weight':800,fill:b.tc||'#8a4d00'},b.t))});
  (c.rows||[c]).forEach(r=>{const col=r.col||c.col||'#cfe0fb',sc='#1b1f2a';
    const wl=g('wl');wl.append(el('line',{x1:sx(r.lw),x2:sx(r.q1),y1:cy,y2:cy,stroke:sc,'stroke-width':2.5}));if(c.caps)wl.append(el('line',{x1:sx(r.lw),x2:sx(r.lw),y1:cy-12,y2:cy+12,stroke:sc,'stroke-width':2.5}));
    const wu=g('wu');if(r.uw>r.q3){wu.append(el('line',{x1:sx(r.q3),x2:sx(r.uw),y1:cy,y2:cy,stroke:sc,'stroke-width':2.5}));if(c.caps)wu.append(el('line',{x1:sx(r.uw),x2:sx(r.uw),y1:cy-12,y2:cy+12,stroke:sc,'stroke-width':2.5}))}
    g('box').append(el('rect',{x:sx(r.q1),width:sx(r.q3)-sx(r.q1),y:cy-bh/2,height:bh,fill:col,stroke:sc,'stroke-width':2.5}));
    g('med').append(el('line',{x1:sx(r.m),x2:sx(r.m),y1:cy-bh/2,y2:cy+bh/2,stroke:sc,'stroke-width':3.5}));
    const o=g('out');(r.out||[]).forEach(v=>o.append(el('circle',{cx:sx(v),cy,r:9,fill:'#fff',stroke:sc,'stroke-width':2.5,class:'bxo'})))});
  /* fences: dashed red lines */
  (c.fences||[]).forEach(f=>{const e=g(f.p);if(!f.show){e.style.opacity=0;e.dataset.h=1}
    e.append(el('line',{x1:sx(f.x),x2:sx(f.x),y1:T-24,y2:ay,stroke:'#d2475b','stroke-width':3,'stroke-dasharray':'9 6'}),
      el('text',{x:sx(f.x)+(f.left?-8:8),y:T-30-(f.lv||0)*28,'text-anchor':f.left?'end':'start','font-size':fs-1,'font-weight':800,fill:'#b0263a'},f.t))});
  /* marks: value guides with labels */
  (c.marks||[]).forEach(m=>{const e=g(m.p);if(!m.show&&!c.show){e.style.opacity=0;e.dataset.h=1}const xx=sx(m.x),col=m.col||'#6a3fc7',ly=T-30-(m.lv||0)*28;
    e.append(el('line',{x1:xx,x2:xx,y1:ly+8,y2:ay,stroke:col,'stroke-width':2.5,'stroke-dasharray':'5 5'}),
      el('text',{x:xx+(m.dx||0),y:ly,'text-anchor':m.anchor||'middle','font-size':fs,'font-weight':800,fill:col},m.t))});
  box.append(s)}
function bxShow(spec){let [sel,ps]=spec.split('|');const b=document.querySelector(sel);if(!b)return;
  if(ps[0]==='='){ps=ps.slice(1);b.querySelectorAll('g.bxp[data-band]').forEach(e=>e.style.opacity=0)}
  ps.split(',').forEach(p=>b.querySelectorAll(`g.bxp[data-p="${p}"]`).forEach(e=>e.style.opacity=1))}
function bxOut(spec){const [sel,col]=spec.split('|');document.querySelectorAll(sel+' circle.bxo').forEach(o=>{o.setAttribute('fill',col||'#d2475b')})}
function s4apply(s,f){if(f.dataset.bx)f.dataset.bx.split(' ').forEach(bxShow);if(f.dataset.bxo)bxOut(f.dataset.bxo)}
function s4reset(s){s.querySelectorAll('[data-chart="box"]').forEach(b=>{const c=JSON.parse(b.dataset.cfg),h=new Set(c.hide||[]);
  b.querySelectorAll('g.bxp').forEach(e=>e.style.opacity=(h.has(e.dataset.p)||e.dataset.h)?0:1);b.querySelectorAll('circle.bxo').forEach(o=>o.setAttribute('fill','#fff'))})}
function s4init(){document.querySelectorAll('[data-chart="box"]').forEach(b=>drawBox(b,JSON.parse(b.dataset.cfg)));
  document.querySelectorAll('[data-hidelab]').forEach(b=>{const hs=JSON.parse(b.dataset.hidelab);b.querySelectorAll('svg text').forEach(t=>{if(hs.includes(t.textContent))t.remove()})})}

/* ---------- reveal engine ---------- */
const frags=s=>[...s.querySelectorAll('.frag')];
function groups(s){const fr=frags(s),out=[],seen={};fr.forEach(f=>{const k=f.dataset.s||f.dataset.g;if(k){if(seen[k])seen[k].push(f);else{seen[k]=[f];out.push(seen[k])}}else out.push([f])});
  const pos=g=>Math.max(...g.map(f=>fr.indexOf(f)));return out.sort((a,b)=>pos(a)-pos(b))}
function focus(s,parts){s.querySelectorAll('[data-part]').forEach(e=>e.classList.toggle('dim',!parts.includes(e.dataset.part)));
  s.querySelectorAll('.sol .frag.shown[data-p]').forEach(e=>e.classList.toggle('dim',!e.dataset.p.split(' ').some(x=>parts.includes(x))))}
function optByLetter(s,L){return [...s.querySelectorAll('.mc div[data-o]')].find(o=>o.dataset.o===L)}
function apply(s,f){
  if(f.dataset.p)focus(s,f.dataset.p.split(' '));
  const card=f.closest('.sc');if(card){const k=[...s.querySelectorAll('.sc')].indexOf(card)+1;s.querySelectorAll(`.cell[data-c="${k}"]`).forEach(c=>c.classList.add('on'))}
  const a=f.dataset.act;
  if(a==='tally')tally(s);if(a==='stack')morphTo(1);if(a==='pct')morphTo(2);
  if(a&&a.startsWith('seg')){const ch=s.querySelector('[data-chart][data-stepped]');grow(ch.querySelectorAll('rect.grow')[+a.slice(3)])}
  if(a==='legend')s.querySelectorAll('[data-chart][data-stepped]').forEach(c=>c.classList.remove('hidelg'));
  if(a==='final')s.querySelector('.report.swap').classList.add('done');
  if(f.dataset.bar!=null){const ch=s.querySelector('[data-chart][data-stepped]');grow(ch.querySelector('rect.grow[data-i="'+f.dataset.bar+'"]')||ch.querySelectorAll('rect.grow')[+f.dataset.bar])}s2apply(s,f);s3apply(s,f);s4apply(s,f);
  if(f.dataset.seg!=null){const ch=f.parentElement.querySelector('[data-chart]');grow(ch.querySelectorAll('rect.grow')[+f.dataset.seg]);if(+f.dataset.seg===2)ch.classList.remove('hidelg')}
  if(f.dataset.fill){const sc=f.closest('.sol')||s;sc.querySelectorAll('.blank.'+f.dataset.fill).forEach((b,k)=>setTimeout(()=>b.classList.add('filled'),k*220))}
  if(f.dataset.key){optByLetter(s,f.dataset.key)?.classList.add('right')}
  if(f.dataset.stat){const st=s.querySelector('.stat');st.querySelector('b').textContent=f.dataset.stat+'%';st.classList.add('done')}
  if(f.dataset.dis&&f.dataset.dis!=='-')optByLetter(s,f.dataset.dis)?.classList.add('dis');
  if(f.dataset.pct){s.classList.add('pct');const mc=s.querySelector('.mc');const d=mc.dataset.dist.split(',').map(Number);
    mc.querySelectorAll('div[data-o]').forEach((o,k)=>{o.querySelector('.pb').style.width=d[k]+'%'})}
  if(f.dataset.chart&&!f.dataset.stepped)animate(f);f.querySelectorAll?.('[data-chart]:not([data-stepped])').forEach(animate)}
function reset(s){frags(s).forEach(f=>f.classList.remove('shown'));s2reset(s);s3reset(s);s4reset(s);s.classList.remove('pct');
  s.querySelectorAll('.dim').forEach(e=>e.classList.remove('dim'));s.querySelectorAll('.cell').forEach(c=>c.classList.remove('on'));
  s.querySelectorAll('.chip').forEach(x=>x.classList.remove('hc','ho'));s.querySelectorAll('.card').forEach(c=>c.classList.remove('open'));
  s.querySelectorAll('.mc div').forEach(o=>o.classList.remove('right','dis'));s.querySelectorAll('.mc .pb').forEach(p=>p.style.width=0);
  const st=s.querySelector('.stat');if(st&&st.querySelector('b')){st.querySelector('b').textContent='?%';st.classList.remove('done')}
  s.querySelectorAll('.blank').forEach(b=>b.classList.remove('filled'));s.querySelectorAll('.report.swap').forEach(r=>r.classList.remove('done'));
  s.querySelectorAll('line.tl').forEach(l=>l.style.opacity=0);
  s.querySelectorAll('[data-chart][data-stepped]').forEach(c=>{c.querySelectorAll('rect.grow').forEach(zero);if(c.dataset.chart==='seg')c.classList.add('hidelg')});
  if(s.querySelector('#morph'))morphTo(0,true);
  s.querySelectorAll('[data-chart]:not([data-stepped]):not(.frag)').forEach(c=>{if(!c.closest('.frag'))animate(c)})}
function steps(s){return [...[...s.querySelectorAll('.card')].map(c=>({card:c})),...groups(s).map(g=>({g}))]}
let step=0;
function doStep(s,st){if(st.card){st.card.classList.add('open');return}
  st.g.forEach(f=>{f.classList.add('shown');apply(s,f)});if(st.g[0].dataset.g)s.querySelectorAll(`line[data-l="${st.g[0].dataset.g}"]`).forEach(l=>l.style.opacity=1)}
function show(n,atEnd){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));const s=slides[i];reset(s);step=0;
  if(atEnd){steps(s).forEach(st=>doStep(s,st));step=steps(s).length}
  document.getElementById('prog').style.width=((i+1)/slides.length*100)+'%'}
function next(){const s=slides[i],all=steps(s);if(step<all.length){doStep(s,all[step]);step++}else show(i+1)}
function back(){const s=slides[i];if(step>0){const n=step-1;reset(s);const all=steps(s);step=0;for(let k=0;k<n;k++){doStep(s,all[k]);step++}}
  else if(i>0)show(i-1,true)}
/* single press = one step; quick double press = whole slide */
let last={dir:0,t:0,slide:0};const DBL=350;
function press(dir){const now=performance.now();
  if(last.dir===dir&&now-last.t<DBL){last.dir=0;show(dir>0?last.slide+1:last.slide-1);return}
  last={dir,t:now,slide:i};dir>0?next():back()}
/* add % labels/bars to MC options */
document.querySelectorAll('.mc[data-dist]').forEach(mc=>{const d=mc.dataset.dist.split(',');mc.querySelectorAll('div[data-o]').forEach((o,k)=>{o.insertAdjacentHTML('afterbegin','<span class="pb"></span>');o.insertAdjacentHTML('beforeend',`<span class="pc">${d[k]}%</span>`)})});
/* video */
const vm=document.getElementById('vmodal');document.querySelectorAll('.vid').forEach(b=>{if(!b.dataset.src)b.classList.add('empty')});
vm.addEventListener('click',e=>{if(e.target===vm){vm.classList.remove('on');vm.querySelector('.box').innerHTML=''}});
function openVid(b){const box=vm.querySelector('.box'),u=b.dataset.src;box.innerHTML=u?(/\.(mp4|webm)$/i.test(u)?`<video src="${u}" controls autoplay></video>`:`<iframe src="${u}" allow="autoplay; fullscreen" allowfullscreen></iframe>`)
  :`<div class="ph"><div style="font-size:60px">▶</div>Video to be added<br><small>${b.dataset.label}</small><small style="color:#8b93a5">Set data-src on this slide's video button to embed it.</small></div>`;vm.classList.add('on')}
addEventListener('keydown',e=>{if(e.repeat)return;if(['ArrowRight','PageDown',' ','Enter','ArrowDown'].includes(e.key)){e.preventDefault();press(1)}if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(e.key)){e.preventDefault();press(-1)}if(e.key==='Escape')vm.classList.remove('on');if(e.key==='f')document.documentElement.requestFullscreen?.()});
stage.addEventListener('click',e=>{const vb=e.target.closest('.vid');if(vb){openVid(vb);return}const c=e.target.closest('.card');if(c&&!c.classList.contains('open')){c.classList.add('open');step++;return}press(1)});
stage.addEventListener('contextmenu',e=>{e.preventDefault();press(-1)});
addEventListener('DOMContentLoaded',()=>{renderMathInElement(document.body,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}]});fitEq();show(0)});
</script>
