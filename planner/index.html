<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12MAG Course Planner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>

:root{--bg:#f6f5f1;--card:#fff;--ink:#1f1e1c;--muted:#6b6a65;--line:#e2e0d8;--accent:#2f5fd0;
--lesson:#eef3fd;--lesson-i:#1d4596;--prac:#e6f5ee;--prac-i:#0f6e56;--sac:#fcebeb;--sac-i:#a32d2d;
--review:#faeeda;--review-i:#854f0b;--other:#f1efe8;--other-i:#5f5e5a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.top{position:sticky;top:0;z-index:5}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;font-weight:600;margin:0 12px 0 0}
.tabs button,.ctl button,.ctl select{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.subbar{background:#fbfaf6;border-bottom:1px solid var(--line);padding:6px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.subbar .toggle{margin:0;border:0;border-radius:0;gap:2px}.subbar .toggle button{border-radius:6px;padding:5px 14px;color:var(--muted)}
.subbar .toggle button.on{background:var(--card);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.ctable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.ctable th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fbfaf6;padding:8px 10px;border-bottom:1px solid var(--line)}
.ctable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}.ctable tr:last-child td{border-bottom:0}
.ctable select,.ctable textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--card)}.ctable textarea{width:100%;min-height:36px;font-size:13px}
.ctable td details{font-size:13px}.ctable td details ul{margin:4px 0;padding-left:18px}
.st-written{color:var(--prac-i)}.st-drafting{color:var(--review-i)}.st-planned{color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:16px 20px 80px}
.unit{font-size:20px;font-weight:600;margin:28px 0 4px}
.aos{margin:18px 0 8px;padding:6px 0;border-top:2px solid var(--ink);display:flex;justify-content:space-between;gap:12px}
.aos b{font-size:15px}.aos span{color:var(--muted)}
.week{display:grid;grid-template-columns:110px repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.week.now .wl b{color:var(--accent)}
.wl{padding-top:6px;color:var(--muted);font-size:12px}.wl b{display:block;color:var(--ink);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:9px 11px;cursor:pointer;min-height:78px;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}
.card.open{outline:2px solid var(--accent)}
.meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.ttl{font-weight:500;line-height:1.3}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:auto}.bar i{display:block;height:100%;background:var(--prac-i);border-radius:4px}
.t-lesson{--c:var(--lesson-i)}.t-prac{--c:var(--prac-i)}.t-sac{--c:var(--sac-i)}.t-review{--c:var(--review-i)}.t-holiday{--c:#2f9e8f}
.card.t-tbc{--c:var(--line);border-style:dashed;background:transparent;color:var(--muted)}.t-tbc .tag{--b:var(--other);--c:var(--muted)}
.card.span3{grid-column:span 3;align-items:center;justify-content:center;text-align:center;min-height:90px}.card.span3 .ttl{font-size:17px;font-weight:600}.card.span3 .meta,.card.span3 .bar{display:none}
.t-consolidation,.t-buffer,.t-options,.t-investigation{--c:var(--other-i)}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--b);color:var(--c)}
.t-lesson .tag{--b:var(--lesson)}.t-prac .tag{--b:var(--prac)}.t-sac .tag{--b:var(--sac)}.t-review .tag{--b:var(--review)}.t-holiday .tag{--b:#e0f4f0}
.t-consolidation .tag,.t-buffer .tag,.t-options .tag,.t-investigation .tag{--b:var(--other)}
.detail{grid-column:2/-1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.detail h2{font-size:17px;margin:0 0 2px}.detail h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 4px}
.katex{font-size:1.05em;white-space:nowrap}
.detail ul{margin:0;padding-left:18px;line-height:1.55}
.detail label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.detail textarea{width:100%;min-height:70px;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.toggle{display:inline-flex;margin:16px 0 2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.toggle button{font:inherit;border:0;background:var(--card);padding:6px 16px;cursor:pointer}.toggle button.on{background:var(--ink);color:#fff}
.ovbtn{font:inherit;font-size:12px;margin-left:10px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 10px;cursor:pointer}
.ov{background:#fbfaf6;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 14px;display:grid;grid-template-columns:1fr 1.3fr;gap:20px}
.ov h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}.ov ol,.ov ul{margin:0;padding-left:20px;line-height:1.55}
@media(max-width:760px){.ov{grid-template-columns:1fr}}
.nest{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--card)}
.nest>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.nest>summary::-webkit-details-marker{display:none}.nest>summary:after{content:"▾";font-size:12px;transition:transform .15s}.nest:not([open])>summary:after{transform:rotate(-90deg)}
.nest>summary .cnt{font-weight:400;text-transform:none;letter-spacing:0;margin-left:auto;margin-right:8px}
.nest>.nb{padding:0 14px 12px;font-size:13px;line-height:1.55}.nest .nb ul{margin:4px 0;padding-left:18px}.nest .nb h4{margin:8px 0 2px;font-size:12px;color:var(--ink)}
.nest.n-mat{border-color:#2f9e8f;background:#f0faf8}.nest.n-mat>summary{color:#1d7266}.mat{margin:4px 0;padding-left:0;list-style:none}.mat li{padding:5px 0;border-bottom:1px dashed #cfe9e4}.mat li:last-child{border-bottom:0}.mat .mrow{display:flex;align-items:center;gap:4px}.mat .mrow .ms{margin:0 0 0 auto}.mat .ms{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:8px;margin-right:4px;background:#e4e4e4;color:#555}.mat .ms.draft{background:#fbe7b5;color:#7a5a00}.mat .mlink{font-size:11.5px;font-weight:600;color:#1d7266;text-decoration:none;border:1px solid #9fd8cd;border-radius:8px;padding:1px 7px;margin-left:2px}.mat .mlink:hover{background:#c9eedf}.mat .ms.ready{background:#c9eedf;color:#14684f}.mat .copies{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px}.mat .copy{border:1px solid #9fd8cd;border-radius:8px;background:#fff;padding:5px 7px;display:flex;flex-direction:column;gap:3px}.mat .copy .cl{display:flex;gap:4px;margin-top:auto}.mat .copy .mlink{margin-left:0}.nest.n-cfat{border-color:#8a6ad8;background:#f7f4fe}.nest.n-cfat>summary{color:#5b3fb0}
.wedo{margin:4px 0;padding-left:0;list-style:none}.wedo li{padding:6px 0;border-bottom:1px dashed var(--line)}.wedo li:last-child{border-bottom:0}.wedo .ytry{font-size:12px;color:var(--prac-i);margin-top:2px}.apk{margin:4px 0;padding-left:0;list-style:none}.apk li{padding:5px 0;border-bottom:1px dashed var(--line)}.apk li:last-child{border-bottom:0}.apk .ak{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:8px;background:var(--line);margin-right:4px}.apk .ak.ex{background:#f3e3c3}.wedo .cgo{display:inline-block;font-size:11px;color:var(--muted);margin-left:6px;white-space:nowrap}.wedo .ytry.none{color:var(--muted);font-style:italic}
.sk{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:var(--bg)}.sk>summary{list-style:none;cursor:pointer;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-weight:500}
.sk>summary>span:first-child{flex:1;text-align:left}.sk>summary::-webkit-details-marker{display:none}.sk>summary .cnt{font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}.sk>summary:before{content:"▸";margin-right:4px;color:var(--muted)}.sk[open]>summary:before{content:"▾"}
.sk.calc{background:#fff}.sk .casg{padding:0 0 6px}.casg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.casg h4{margin:6px 0 6px}@media(max-width:760px){.casg{grid-template-columns:1fr}}
.vid{margin-bottom:10px}.vid .vt{font-size:12px;line-height:1.35;margin:4px 0 2px}.vid a{font-size:12px}
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000;cursor:pointer;border:0;padding:0}
.yt img{width:100%;height:100%;object-fit:cover;opacity:.85}.yt:after{content:"▶";position:absolute;inset:0;margin:auto;width:46px;height:32px;border-radius:8px;background:#c4302b;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.yt.on:after{display:none}.yt iframe{width:100%;height:100%;border:0}
.pracbox{margin-top:14px;border:1.5px solid var(--prac-i);background:var(--prac);border-radius:10px;padding:10px 14px}.pracbox ul{margin:6px 0;padding-left:18px}
.tags{display:flex;gap:4px}.tag.cfat{background:#efe9fb;color:#5b3fb0;font-weight:600}
.card.has-cfat{box-shadow:inset 0 -3px 0 #8a6ad8}
.cfx{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}.cfx th{text-align:left;font-weight:600;color:#5b3fb0;border-bottom:1.5px solid #cfc2f0;padding:3px 4px}.cfx td{border-bottom:1px solid #e6def9;padding:3px 4px;vertical-align:top}.cfx td:first-child{white-space:nowrap}.cfx td.n{text-align:center;font-weight:600}.cfx-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px}.cfx-sum span{background:#efe9fb;color:#5b3fb0;border-radius:8px;padding:1px 8px}.cfx-sum .cfx-pill{font-weight:700;background:#8a6ad8;color:#fff}.cfatbox{margin-top:14px;border:1.5px solid #8a6ad8;background:#f7f4fe;border-radius:10px;padding:10px 14px}.cfatbox h3{margin-top:10px}.cfatbox summary{cursor:pointer;font-size:14px}
.arules,.acard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0}
.arules h3,.acard h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:12px 0 4px}
.arules ul,.acard ul{margin:0;padding-left:18px;line-height:1.6}.acard p{margin:0;line-height:1.5}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:15px}
.agrid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}.goto{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 10px;cursor:pointer}
.src{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--other);color:var(--other-i)}.src-cambridge{background:var(--prac);color:var(--prac-i)}.src-mr{background:var(--lesson);color:var(--lesson-i)}.src-pearson{background:var(--review);color:var(--review-i)}
.nosol{color:var(--sac-i)}.gaps li{color:var(--review-i)}details summary{cursor:pointer}
@media(max-width:760px){.agrid{grid-template-columns:1fr}}
.seq{border-left:1px solid var(--line);padding-left:22px}
.seqhead{display:flex;justify-content:space-between;align-items:baseline}
.seqempty{color:var(--muted);font-style:italic;border:1px dashed var(--line);border-radius:10px;padding:30px;text-align:center}
.goals{background:var(--lesson);color:var(--lesson-i);border-radius:8px;padding:8px 12px;font-size:13px}.goals ul{margin:4px 0 0;padding-left:18px}
.steps{list-style:none;padding:0;margin:10px 0 0}
.step{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.stime{font-size:12px;font-weight:600;color:var(--ink)}.stime span{font-weight:400;color:var(--muted)}
.sphase{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--c,var(--muted));font-weight:600}
.stitle{font-weight:500}.sdetail{font-size:13px;line-height:1.5;margin-top:2px}.sres{font-size:12px;color:var(--muted);margin-top:4px}.sres:before{content:"Resources: "}
.donow{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.5}.donow li{margin-bottom:4px}
.ph-apk{--c:#b5487a}.ph-learning,.ph-course{--c:var(--muted)}
.ph-do-now{--c:var(--review-i)}.ph-new{--c:var(--lesson-i)}.ph-guided{--c:var(--lesson-i)}.ph-apply{--c:var(--prac-i)}.ph-exit{--c:#5b3fb0}
.vocab{display:flex;flex-wrap:wrap;gap:5px}.vocab span{font-size:12px;background:var(--other);border-radius:6px;padding:2px 8px}
@media(max-width:760px){.seq{border-left:0;padding-left:0}}
.sub{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-style:italic}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:flex;gap:5px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.placeholder{background:var(--card);border:1px dashed var(--muted);border-radius:12px;padding:40px;text-align:center;color:var(--muted);margin-top:30px}
@media(max-width:760px){.week{grid-template-columns:1fr}.detail{grid-column:1;grid-template-columns:1fr}}

.ph-cfat{--c:#5b3fb0}.ph-prac,.ph-analysis{--c:var(--prac-i)}.ph-pre-lab,.ph-logbook{--c:var(--review-i)}
.res{margin:0;padding-left:18px;line-height:1.55}.res .path{display:block;font-size:11px;color:var(--muted);word-break:break-all}
.teach{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px}.teach h3{margin-top:0}
.scope{font-size:12px;color:var(--muted)}
.wdates{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* planner additions */
.week.chap{grid-template-columns:110px minmax(0,1fr);margin-bottom:6px;align-items:start}.week.chap .card{min-height:0}.week.chap .wl{height:0;overflow:visible}
.wl .cn{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.t-check{--c:var(--sac-i)}.t-check .tag{--b:var(--sac)}
.t-buffer{--c:var(--other-i)}.card.t-buffer{border-style:dashed;background:transparent;color:var(--muted)}
.t-blocked{--c:var(--line)}.card.t-blocked{background:#f1efe8;color:var(--muted);cursor:default}
.t-anchor{--c:var(--review-i)}.t-anchor .tag{--b:var(--review)}
.card.shell .ttl{color:var(--muted);font-style:italic}
.revrow{color:var(--muted);font-size:12px;margin:-2px 0 12px 120px}
.shape{list-style:none;padding:0;margin:10px 0 0}
.shape li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.shape .sphase{padding-top:1px}
.shape .none{color:var(--muted);font-style:italic}
.warn{background:var(--sac);color:var(--sac-i);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px}
.ystats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.ystats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.ystats b{font-size:17px;display:block}
.placeholder ul{text-align:left;display:inline-block;margin:10px 0 0;line-height:1.7}
.hwrow{display:flex;gap:10px;align-items:baseline}.hwrow .hws{flex:1;min-width:0;white-space:nowrap;overflow:hidden}.hwrow b{white-space:nowrap}
.chgrid{display:grid;grid-template-columns:110px minmax(0,1.6fr) minmax(0,1fr);gap:10px;align-items:start;margin-bottom:14px}
.col{display:flex;flex-direction:column;gap:6px}.colh{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.chgrid .card{min-height:0}.chgrid .detail{grid-column:auto;grid-template-columns:1fr;gap:10px}
.t-cfat{--c:#8a6ad8}.card.fa{cursor:default}.card.fa .ms{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px}
.card.fa .ms.draft{background:var(--review);color:var(--review-i)}.card.fa .ms.ready{background:var(--prac);color:var(--prac-i)}
.cpl.cp2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}.cpc{border:1px solid #d6d0e8;border-radius:8px;background:#fff;padding:5px 7px;display:flex;flex-direction:column;gap:4px}.cpc a{margin-left:0!important;margin-right:3px}.cpl{display:flex;flex-direction:column;gap:3px;font-size:12px}.cpl a{color:#1d7266;text-decoration:none;border:1px solid #9fd3c9;border-radius:6px;padding:0 6px;margin-left:3px;font-weight:600}
@media(max-width:760px){.chgrid{grid-template-columns:1fr}}
.nest.n-test{border-color:#d9a3a3;background:#fdf5f5}.nest.n-test>summary{color:var(--sac-i)}.n-test .cfx th{color:var(--sac-i);border-color:#e8c4c4}.n-test .cfx td{border-color:#f1dede}
/* Course plan: term rows of chapter cards (look copied from the 10MA planner, Rocco 16 Nov) */
.ctl2{display:flex;gap:8px;margin:14px 0 4px}.ctl2 button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;cursor:pointer}
.trow{margin:14px 0 18px}.trh{font-weight:700;font-size:15px;border-bottom:2px solid var(--ink);padding:4px 0;margin-bottom:10px;display:flex;justify-content:space-between}.trh span{font-weight:400;color:var(--muted);font-size:13px}.trh span.over{color:#a32d2d;font-weight:600}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ucard{background:#fff;border:1px solid #ddd;border-left:6px solid var(--ac);border-radius:8px;padding:10px 12px;cursor:pointer;transition:box-shadow .15s}.ucard:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ucard.open{background:var(--acb);box-shadow:inset 0 0 0 2px var(--ac)}
.a1{--ac:#1f4fa0;--acb:#eef3fb}.a2{--ac:#b5532a;--acb:#fbf0ea}.a3{--ac:#2e8b3e;--acb:#eef7ef}.a4{--ac:#2e7f8b;--acb:#ecf6f7}
.uc1{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}.uname{font-weight:700;font-size:15px;margin:3px 0}.umeta{font-size:12px;color:var(--muted)}
.ubad{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.ubad span{font-size:11px;padding:1px 7px;border-radius:9px;background:#eee;color:#888}.ubad span.y{background:#dff1e2;color:#1a6b2a}.ubad span.p{background:#fdf1d8;color:#8a5a00}
.uspan{font-size:12px;color:#b5532a;font-weight:600;margin-top:4px}
.uopen{margin-top:12px;border:1px solid #ddd;border-radius:10px;padding:6px 12px 12px;background:#fcfcfa}.uopen .aos{margin-top:8px}
.evcard{background:#fdf3e6;border:1px dashed #e0a96d;border-radius:8px;padding:10px 12px;color:#7a4510}.evcard .uc1,.evcard .umeta{color:#a0662a}.evcard.sac{background:#fbeaea;border-color:#d98c8c;color:#7a1f1f}.evcard.sac .uc1,.evcard.sac .umeta{color:#a34a4a}
.udcard{background:var(--ac);color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-self:start}.udcard:hover{filter:brightness(1.08)}
.udcard .uc1{color:rgba(255,255,255,.8)}.udcard .uname{font-size:14px;margin:0}.udcard .umeta{color:rgba(255,255,255,.85)}.udcard.open{box-shadow:0 0 0 3px var(--acb),0 0 0 5px var(--ac)}
.udpanel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.udpanel h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 6px}
@media(max-width:900px){.udpanel{grid-template-columns:1fr}}.udrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}.udrow:first-child{border-top:0}.udrow .sub{color:var(--muted)}
.udrow .ms{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:8px;background:#e4e4e4;color:#555}.udrow .mlink{font-size:11.5px;font-weight:600;color:#1d7266;text-decoration:none;border:1px solid #9fd8cd;border-radius:8px;padding:1px 7px;margin-left:2px}.udpanel .nb h4{margin:8px 0 2px;font-size:12px}
.evcard.exam{background:#eef0fb;border-color:#9aa3d9;color:#2c3576}.evcard.exam .uc1,.evcard.exam .umeta{color:#4a54a0}
</style>
</head>
<body>
<div class="top">
<header>
  <h1>12MAG Course Planner</h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="subbar" id="subbar">
  <span class="sub" id="subinfo"></span>
  <div class="ctl" id="ctl">
    <select id="aosFilter"><option value="">All areas of study</option></select>
    <button id="expand">Expand all</button>
  </div>
</div>
</div>
<main id="main"></main>
<script>
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TYPE={lesson:'Lesson',check:'Chapter test',buffer:'Buffer',blocked:'No lesson',anchor:'Fixed date'};
let UP=null,YEARS=[],YD={},tab=store.get('pl:tab','course'),openId=null,expandAll=false;
const cfs=l=>l.cfats||[];
function list(arr,empty){return arr&&arr.length?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<div class="empty">${empty||'None'}</div>`}
function typeset(){if(window.renderMathInElement)renderMathInElement($('#main'),{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false})}
function cfatDetails(c){const Q=c.questions||[];
  const summ=`<div class="cfx-sum"><span class="cfx-pill">/${c.marks||'?'}</span>${c.mcMarks!=null?`<span>MC ${c.mcMarks}</span><span>Short answer ${c.saMarks}</span>`:''}<span>${esc(c.format||'')}</span></div>`;
  const bySub=c.bySub?.length?`<h3>Marks by subchapter &amp; success criteria</h3><table class="cfx"><tr><th>Sub</th><th>Marks</th><th>Success criteria tested</th></tr>${c.bySub.map(b=>`<tr><td><b>${esc(b.sub)}</b></td><td class="n">${b.marks}</td><td>${b.sc.map(esc).join('<br>')}</td></tr>`).join('')}</table>`:'';
  const bySd=c.bySd?.length?`<h3>Study Design coverage</h3><table class="cfx"><tr><th>Code</th><th>Dot point</th><th>Marks</th><th>Qs</th></tr>${c.bySd.map(b=>`<tr><td><b>${esc(b.code)}</b></td><td>${esc(b.text)}</td><td class="n">${b.marks}</td><td>${esc(b.qs.join(', '))}</td></tr>`).join('')}</table>`:'';
  const qs=Q.length?`<h3>Question breakdown</h3><table class="cfx"><tr><th>Q</th><th>Mk</th><th>Skill</th><th>Study Design</th><th>Sub</th><th>Follow-up if wrong</th></tr>${Q.map(x=>`<tr><td><b>${esc(String(x.q))}</b> <span class="sub">${x.type}</span></td><td class="n">${x.marks}</td><td>${esc(x.skill)}<div class="sub">${esc(x.src)}</div></td><td>${esc(x.sd.join(', '))}</td><td>${esc(x.sub)}</td><td>${x.fu?esc(x.fu):'<span class="sub">TBC</span>'}</td></tr>`).join('')}</table>`:'';
  return `<div><div class="ttl"><b>${esc(c.id)}</b> · ${esc(c.title)}</div>${summ}
  ${bySub}${bySd}${qs}</div>`}
const nestOpen=k=>store.get('nest:'+k,false);
function nest(k,title,body,cnt,cls){return body?`<details class="nest ${cls||''}" data-nest="${k}" ${nestOpen(k)?'open':''}><summary>${title}${cnt!=null?`<span class="cnt">${cnt}</span>`:''}</summary><div class="nb">${body}</div></details>`:''}
function grouped(arr){return (arr||[]).map(g=>`<h4>${esc(g.sub)}</h4>${list(g.items)}`).join('')}
function nests(l){const c=cfs(l),n=a=>(a||[]).reduce((t,g)=>t+(g.items?g.items.length:1),0);
  return nest('mat','Lesson materials',l.materials?.length?`<ul class="mat">${l.materials.map(x=>`<li><div class="mrow"><b>${esc(x.kind)}</b>${x.file&&!x.copies?.length?` · <a class="mlink" href="${esc(x.file)}" target="_blank" rel="noopener">Open ↗</a>`:''}${x.pdf&&!x.copies?.length?` <a class="mlink pdf" href="${esc(x.pdf)}" download>PDF ⬇</a>`:''}<span class="ms ${x.status}">${x.status=='ready'?'Ready':x.status=='draft'?'Draft':'To make'}</span></div><div class="sub">${esc(x.desc)}</div>${x.copies?.length?`<div class="copies">${x.copies.map(c=>`<div class="copy"><b>${esc(c.label)}</b>${c.note?`<div class="sub">${esc(c.note)}</div>`:''}<div class="cl">${c.file?`<a class="mlink" href="${esc(c.file)}" target="_blank" rel="noopener">Open ↗</a>`:''}${c.pdf?`<a class="mlink pdf" href="${esc(c.pdf)}" download>PDF ⬇</a>`:''}${!c.file&&!c.pdf?`<span class="ms">To make</span>`:''}</div></div>`).join('')}</div>`:''}</li>`).join('')}</ul>`:'',l.materials?.filter(x=>x.status=='ready').length+'/'+l.materials?.length,'n-mat')
   +nest('lo','Learning objectives',l.learningObjectives?.length?grouped(l.learningObjectives):'',n(l.learningObjectives))
   +nest('sc','Success criteria',l.successCriteria?.length?grouped(l.successCriteria):'',n(l.successCriteria))
   +nest('sd','Study Design',l.studyDesign?.length?list(l.studyDesign):'',l.studyDesign?.length)
   +nest('voc','Key vocabulary',l.keyVocab?.length?`<ul>${l.keyVocab.map(v=>{const i=v.indexOf(': ');return `<li>${i>0?`<b>${esc(v.slice(0,i))}</b>: ${esc(v.slice(i+2))}`:esc(v)}</li>`}).join('')}</ul>`:'',l.keyVocab?.length)
   +nest('cas','CAS guide',l.cas?.length?l.cas.map(id=>CAS[id]).filter(Boolean).map(k=>`<details class="sk"><summary><span>${esc(k.skill)}</span><span class="cnt">${['ClassPad','TI'].filter((x,i)=>(i?k.ti:k.classpad).length).join(' · ')||'steps to write'}</span></summary>${k.note?`<div class="sub" style="padding:0 10px">${esc(k.note)}</div>`:''}<div style="padding:0 10px 8px">${k.tiOnly?'':calc('Casio ClassPad',k.classpad,k.videos.classpad)}${calc('TI-Nspire',k.ti,k.videos.ti)}${k.tip?`<div class="sub" style="margin-top:6px"><b>Tip:</b> ${k.tip}</div>`:''}</div></details>`).join(''):'',l.cas?.length)
   +nest('vid','Self-study videos',lessonVids(l).length?`<div class="casg" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${lessonVids(l).map(v=>`<div><div class="sub"><b>${esc(v.sub)}</b> · ${esc(v.channel)} · ${esc(v.length)}</div>${vids([v])}</div>`).join('')}</div>`:'',lessonVids(l).length)
   +nest('donow','Do Now',l.doNow?.length?`<ul class="apk">${l.doNow.map(x=>`<li><span class="ak ex">${esc(x.exam)}</span> ${esc(x.ref)}</li>`).join('')}</ul>`:'',l.doNow?.length)
   +nest('apk','APK (prior knowledge)',l.apk?.length?`<ul class="apk">${l.apk.map(x=>`<li><span class="ak ${x.kind=='Exam'?'ex':''}">${x.kind=='Exam'?'Exam Q':'Skill'}</span> ${esc(x.text)}<div class="sub">${esc(x.ref)}</div></li>`).join('')}</ul>`:'',l.apk?.length)
   +nest('wedo','Worked examples &amp; you trys',l.weDo?.length?`<ol class="wedo">${l.weDo.map(x=>`<li><span class="sub">${esc(x.sub)}</span> <b>Example ${x.n}</b> · ${esc(x.title)}${x.video?`<span class="cgo" title="${esc(x.video)}">▶ video</span>`:''}<div class="${x.youTry&&x.youTry!='TBM'?'ytry':'ytry none'}">${x.youTry=='TBM'?'You try: to be mapped':x.youTry?'You try: '+esc(x.youTry):'No you try'}</div></li>`).join('')}</ol>${l.weDoNote?`<div class="sub">${esc(l.weDoNote)}</div>`:''}`:'',l.weDo?.length)
   +nest('exit','Exit tasks',l.exit?.length?`<ul class="apk">${l.exit.map(x=>`<li><span class="ak ex">${/Exam 1/.test(x.src)?'Exam 1':'Exam 2'}</span> ${esc(x.ref)}<div class="sub">${esc(x.src)}</div></li>`).join('')}</ul>`:'',l.exit?.length)
   +nest('hw','Coursework',l.homework?.sets?.length?l.homework.sets.map(s=>`<h4>${esc(s.title)}</h4>${s.items.length?`<ul class="apk">${s.items.map(i=>`<li class="hwrow"><span class="hws">${esc(i.skill)}</span><b>${esc(i.q)}</b></li>`).join('')}</ul>`:''}${s.note?`<div class="sub">${esc(s.note)}</div>`:''}`).join(''):'',l.homework?.sets?.length?l.homework.sets.length+' exercise'+(l.homework.sets.length>1?'s':''):null)}
const ytId=u=>{const m=String(u).match(/[?&]v=([\w-]{11})/)||String(u).match(/youtu\.be\/([\w-]{11})/);return m?m[1]:''};
const ytStart=u=>{const m=String(u).match(/[?&]t=(\d+)/);return m?m[1]:''};
function steps(a){return a?.length?`<ol class="st" style="margin:0 0 6px;padding-left:18px;font-size:12.5px;line-height:1.45">${a.map(x=>`<li>${x}</li>`).join('')}</ol>`:'<div class="empty">Steps to write</div>'}
function calc(name,st,vs){return `<details class="sk calc"><summary><span>${name}</span><span class="cnt">${st.length?st.length+' steps':'steps to write'} · ${vs.length?'video':'no video'}</span></summary><div style="padding:0 10px 8px">${steps(st)}<div class="casg" style="grid-template-columns:minmax(0,260px)">${vids(vs.slice(0,1))}</div>${vs.length>1?`<details class="sk calc"><summary><span>More videos</span><span class="cnt">${vs.length-1}</span></summary><div class="casg" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:0 10px 8px">${vids(vs.slice(1))}</div></details>`:''}</div></details>`}
function lessonVids(l){const S=l.subchapters||[];return VIDS.filter(v=>S.includes(v.sub))}
function vids(arr){return (arr||[]).map(v=>{const id=ytId(v.url);return `<div class="vid"><button class="yt" data-yt="${id}" data-start="${ytStart(v.url)}" aria-label="Play ${esc(v.title)}"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt=""></button><div class="vt">${esc(v.title)}</div><a href="${esc(v.url)}" target="_blank" rel="noopener">Open on YouTube ↗</a></div>`}).join('')||'<div class="empty">No video</div>'}

/* ---------- data ---------- */
function range(subs){ // ['1C','1D','1E'] -> '1C–1E'; ['7B','7D'] -> '7B, 7D'
  if(!subs.length)return '';
  const ok=subs.every((s,i)=>i==0||(parseInt(s)==parseInt(subs[0])&&s.slice(-1).charCodeAt(0)==subs[i-1].slice(-1).charCodeAt(0)+1));
  return subs.length>2&&ok?`${subs[0]}–${subs[subs.length-1]}`:subs.join(subs.length==2&&ok?'–':', ')}
const BUST='?v='+Date.now(); // always open the newest file, never a copy the browser saved earlier
function lessons(){const out=[];let n=0;
  UP.aos.forEach(a=>a.chapters.forEach(c=>c.lessons.forEach(l=>{n++;
    const k=l.card||{};
    const fx=m=>({...m,file:m.file?'../'+m.file+BUST:m.file,pdf:m.pdf?'../'+m.pdf+BUST:m.pdf});
    const materials=(k.materials||[]).map(m=>({...fx(m),copies:m.copies?m.copies.map(fx):m.copies}));
    const cf=(k.cfats||[]).map(x=>({...x,file:x.file?'../'+x.file:x.file}));
    out.push({...k,materials,cfats:cf,id:l.id,n,type:l.kind,shell:!!l.shell,subchapters:l.subchapters,part:l.part,
      section:l.subchapters.length?range(l.subchapters)+(l.part?` (part ${l.part})`:''):`Ch ${c.n}`,
      title:l.title||'Not planned yet',aos:`AoS ${a.n}`,aosTitle:a.title,aosN:a.n,ch:c.n,chTitle:c.title,revision:a.revision});
  })));return out}
/* ---------- shared card + detail ---------- */
function card(l,extra){return `<div class="card t-${l.type} ${l.shell?'shell':''} ${cfs(l).length?'has-cfat':''} ${openId==l.id?'open':''}" data-id="${l.id}">
  <div class="meta"><span>${typeof l.n=='number'?'L'+l.n+(l.section?' · ':''):''}${l.section?esc(l.section):''}</span><span class="tags">${cfs(l).length?`<span class="tag cfat">${cfs(l).length>1?cfs(l).length+' CFATs':'CFAT'}</span>`:''}<span class="tag">${l.shell?'To plan':TYPE[l.type]}</span></span></div>
  <div class="ttl">${esc(l.title)}</div>${extra||''}</div>`}
const DECKS={},CAS={};let TESTS={};let VIDS=[];
function deckOf(l){const m=(l.materials||[]).find(x=>x.kind=='Guided slides'&&x.file);return m?m.file:null}
const SHAPES_ON=false; // Rocco, 15 Nov: lesson shapes cleared; fill them in last (set true to bring back the slide-read outline)
function shapePane(l){
  if(!SHAPES_ON)return `<div class="seqhead"><h3 style="margin-top:0">Lesson shape</h3></div><div class="seqempty">To be filled in last.</div>`;
  if(l.type=='check')return `<div class="seqhead"><h3 style="margin-top:0">Coursework check + chapter test</h3></div><ol class="shape">
    <li><span class="sphase ph-cfat">Check</span><span>Coursework checklist: CFATs, bound reference, guided notes, Cambridge coursework exercises</span></li>
    <li><span class="sphase ph-exit">Test</span><span>Chapter test: Mathspace topic assessment</span></li></ol>`;
  const f=deckOf(l);
  if(!f)return `<div class="seqhead"><h3 style="margin-top:0">Lesson shape</h3></div><div class="seqempty">Slides not made yet.<br>The lesson shape appears here once the slide deck exists.</div>`;
  return `<div class="seqhead"><h3 style="margin-top:0">Lesson shape</h3></div><div data-deck="${esc(f)}"><div class="sub">Reading the slides…</div></div>`}
const PH=[[/^CFAT/i,'CFAT','ph-cfat'],[/^Do Now/i,'Do Now','ph-do-now'],[/^APK/i,'APK','ph-apk'],[/^Learn/i,'Learn','ph-new'],[/^Worked example/i,'Example','ph-guided'],[/^You try/i,'You try','ph-apply'],[/^CAS/i,'CAS','ph-guided'],[/^Exit/i,'Exit task','ph-exit'],[/^Check-in/i,'Check-in','ph-learning'],[/^Homework/i,'Coursework','ph-learning']];
function outline(doc){
  return [...doc.querySelectorAll('section.slide')].map((s,i)=>{
    const pill=(s.querySelector('.pill')?.textContent||'').replace(/\s+/g,' ').trim();
    const head=(s.querySelector('h1,h2,.wename')?.textContent||'').replace(/\s+/g,' ').trim();
    const ph=PH.find(([re])=>re.test(pill));
    const label=ph?ph[1]:(s.classList.contains('s-title')?'Title':/success criteria/i.test(s.textContent)?'Success criteria':'Intro');
    return {n:i+1,label,cls:ph?ph[2]:'ph-learning',pill,head}})}
function fillDecks(){document.querySelectorAll('[data-deck]').forEach(async el=>{
  const f=el.dataset.deck;
  try{ if(!DECKS[f])DECKS[f]=outline(new DOMParser().parseFromString(await (await fetch(f,{cache:'no-store'})).text(),'text/html'));
    const O=DECKS[f], cnt=k=>O.filter(x=>x.label==k).length;
    const sum=['CFAT','Do Now','APK','Example','You try','CAS','Exit task'].filter(k=>cnt(k)).map(k=>`${k} ×${cnt(k)}`).join(' · ');
    el.innerHTML=`<div class="sub" style="margin:6px 0 2px">${O.length} slides · ${sum}</div><ol class="shape">${O.map(x=>`<li><span class="sphase ${x.cls}">${x.n} · ${esc(x.label)}</span><span>${esc(x.label=='Title'||x.label=='Intro'||x.label=='Success criteria'?x.head:x.pill.replace(/^(Worked example|You try|Learn|CAS|APK)\s*·?\s*/i,'')+(x.head&&!/^(Show what you know|How did you go\?|Homework|Coursework)$/.test(x.head)?' — '+x.head:''))}</span></li>`).join('')}</ol>`;
  }catch(e){el.innerHTML='<div class="empty">Could not read the slide file.</div>'}})}
function detail(l){
  return `<div class="detail" data-for="${l.id}"><div>
    <div class="meta"><span>${esc(l.aos)} · Chapter ${l.ch} · Lesson ${l.n}${l.when?' · '+esc(l.when):''}</span></div>
    <h2>${l.section?esc(l.section)+' · ':''}${esc(l.title)}</h2>
    ${nests(l)||(l.type=='check'?'':'<div class="empty" style="margin-top:10px">No lesson card yet.</div>')}
  </div><div class="seq">${shapePane(l)}</div></div>`}
function wire(rerender){
  $('#main').querySelectorAll('.card[data-id]').forEach(el=>{if(el.classList.contains('t-blocked')||el.classList.contains('t-anchor'))return;el.onclick=()=>{openId=openId==el.dataset.id?null:el.dataset.id;rerender()}});
  $('#main').querySelectorAll('.detail').forEach(dv=>{
    dv.querySelectorAll('[data-nest]').forEach(n=>n.ontoggle=()=>store.set('nest:'+n.dataset.nest,n.open));
    dv.querySelectorAll('.yt[data-yt]').forEach(bt=>bt.onclick=()=>{bt.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${bt.dataset.yt}?autoplay=1${bt.dataset.start?'&start='+bt.dataset.start:''}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;bt.onclick=null;bt.style.cursor='default';bt.classList.add('on')});});
  $('#main').querySelectorAll('.card.fa [data-nest]').forEach(n=>n.ontoggle=()=>store.set('nest:'+n.dataset.nest,n.open));
  typeset(); fillDecks(); fitRows();
  document.querySelectorAll('[data-nest="hw"]').forEach(n=>n.addEventListener('toggle',fitRows));
}
function fitRows(){document.querySelectorAll('.hws').forEach(el=>{if(!el.offsetWidth)return;let f=13;el.style.fontSize='';while(el.scrollWidth>el.clientWidth&&f>9){f-=.5;el.style.fontSize=f+'px'}})}
window.addEventListener('resize',fitRows);
function aosFilter(L){const sel=$('#aosFilter'),f=sel.value;
  sel.innerHTML='<option value="">All areas of study</option>'+UP.aos.map(a=>`<option value="AoS ${a.n}" ${f=='AoS '+a.n?'selected':''}>AoS ${a.n}: ${esc(a.title)}</option>`).join('');
  return L.filter(l=>!f||l.aos==f)}
function testDetails(t){const tb=(h,r)=>`<table class="cfx"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')}</table>`;
  return `<div class="cfsum"><span class="tag cfat">/${t.total}</span> <span class="sub">MC ${t.mc} · Short answer ${t.sa}</span></div><div class="sub" style="margin:4px 0">${esc(t.about)}</div>
  <h3>Marks by Mathspace lesson</h3>${tb(['Lesson','Marks','Qs'],t.byLesson.map(b=>`<tr><td><b>${esc(b.lesson)}</b></td><td class="n">${b.marks}</td><td>${esc(b.qs.join(', '))}</td></tr>`))}
  <h3>Question breakdown</h3>${tb(['Q','Mk','Question','Lesson'],t.questions.map(q=>`<tr><td><b>${esc(q.q)}</b> <span class="sub">${q.type}</span></td><td class="n">${q.marks}</td><td>${esc(q.text)}${q.answer?` <span class="sub">(${q.answer})</span>`:''}</td><td>${esc(q.src.split('·').pop().trim())}</td></tr>`))}`}
const isFA=m=>/^(CFAT|Chapter test)/i.test(m.kind);
function links(x){return `${x.file?`<a class="mlink" href="${esc(x.file)}" target="_blank" rel="noopener">Open ↗</a>`:''}${x.pdf?` <a class="mlink pdf" href="${esc(x.pdf)}" download>PDF ⬇</a>`:''}`}
function formatives(C){const seen=new Set(),out=[];
  C.forEach(l=>{(l.materials||[]).filter(isFA).forEach(m=>{if(!seen.has(m.kind)){seen.add(m.kind);out.push({m,l})}});
    cfs(l).forEach(c=>{if(!seen.has(c.id)){seen.add(c.id);out.push({m:{kind:c.id,status:/ready/i.test(c.status)?'ready':/draft/i.test(c.status)?'draft':'',file:c.file},l})}})});
  out.sort((x,y)=>(/^Chapter test/i.test(x.m.kind)?1:0)-(/^Chapter test/i.test(y.m.kind)?1:0));
  return out.length?out.map(({m,l})=>{const test=/^Chapter test/i.test(m.kind),c=cfs(l).find(x=>x.id==m.kind);
    return `<div class="card fa ${test?'t-check':'t-cfat'}"><div class="meta"><span></span><span class="ms ${m.status}">${m.status=='ready'?'Ready':m.status=='draft'?'Draft':'To make'}</span></div>
    <div class="ttl"><b>${test?'Chapter '+l.ch+' test':esc(m.kind)}</b>${c&&c.title?' · '+esc(c.title):''}</div>

const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const iso=d=>d.toISOString().slice(0,10);

/* Anchors: {date,label,aos?,unit?,afterSchool?,inClass?,window?}. aos (or unit) = later-AoS lessons wait until after it and

/* ---------- tabs ---------- */
function render(){
  $('#tabs').innerHTML=[['course','Course plan'],...YEARS.map(y=>[y,'Year plan '+y])].map(([k,n])=>`<button data-t="${k}" class="${tab==k?'on':''}">${n}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;store.set('pl:tab',tab);openId=null;render()});
  $('#ctl').style.display='flex';
  if(tab!='course'&&YEARS.includes(tab))renderYear(tab);else{tab='course';renderCourse()}
}
$('#aosFilter').onchange=()=>render();
$('#expand').onclick=()=>{expandAll=!expandAll;$('#expand').textContent=expandAll?'Collapse all':'Expand all';render()};
(async()=>{try{
  UP=await (await fetch('unit-plan.json',{cache:'no-store'})).json();
  try{(await (await fetch('cas-skills.json',{cache:'no-store'})).json()).skills.forEach(k=>CAS[k.id]=k)}catch(e){}
  try{TESTS=await (await fetch('tests.json',{cache:'no-store'})).json()}catch(e){}
  try{VIDS=(await (await fetch('videos.json',{cache:'no-store'})).json()).videos}catch(e){}
  YEARS=await (await fetch('years/index.json',{cache:'no-store'})).json();
  for(const y of YEARS){try{YD[y]=await (await fetch(`years/${y}.json`,{cache:'no-store'})).json()}catch(e){YD[y]=null}}
  render();
}catch(e){$('#main').innerHTML='<div class="placeholder">Could not load the planner data. Open this page from the website, not as a local file.</div>'}})();
</script>
</body>
</html>
